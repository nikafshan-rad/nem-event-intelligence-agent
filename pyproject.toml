[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nem-agent"
version = "2.0.0"
description = "Independent research assistant over public Australian NEM market data: bounded tools, cited retrieval, validated reports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "duckdb>=1.1,<2",
  "pyarrow>=17",
  "pandas>=2.2",
  "numpy>=2.0",
  "tzdata>=2024.1",
  "pytz>=2024.1",
  "pypdf>=5.0",
  "model2vec>=0.4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "openai>=1.60",
  "streamlit>=1.40",
  "altair>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "pandas-stubs", "types-requests"]

[project.scripts]
nem-agent = "nem_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nem_agent = ["prompts/*/*.md", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "network: test performs a real network fetch (skipped when NEM_OFFLINE=1)",
  "synthetic: test uses clearly-labelled synthetic fixtures, never real observations",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF005", "RUF007", "RUF046", "SIM108"]

[tool.mypy]
python_version = "3.12"
packages = ["nem_agent"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
