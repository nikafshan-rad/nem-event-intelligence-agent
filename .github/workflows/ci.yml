name: ci

# Deterministic check against the reviewed, pinned source versions only. It never accepts upstream content that
# differs from data/source_selection.json; the separate publisher-refresh workflow (refresh.yml) detects and
# reports revisions for review (docs/source-governance.md).
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fresh:
        description: "Ignore the cache and download every pinned source from the publishers"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # HEAD^ is the base branch (pull requests) or the previous commit (pushes)
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pin changes carry a reviewed history entry
        run: python scripts/check_pin_changes.py --base HEAD^
      # Publisher files are fetched from AEMO/NASA by `make data`/`make index` (not committed; docs/decisions.md D2).
      # The cache is reused only for the exact same pin set. No prefix fallback: an older cache would bring back
      # market notices that have since rolled off NEMWeb and hide them, so any change to the pins runs against what
      # a fresh setup gets today (docs/decisions.md D20).
      - name: Cache verified publisher files and the embedding model
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.fresh) }}
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/models
          key: nem-raw-${{ hashFiles('data/source_selection.json') }}
      - name: Install (pinned)
        run: make setup SYSTEM_PY=python
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Fetch real data and build the store (no secrets needed)
        run: make data
      - name: Build the document index
        run: make index
      - name: Tests (unit, integration, real-data, synthetic safety fixtures)
        run: make test
      - name: Offline evaluation (replay; hosted-model evaluation is not run in CI)
        run: make eval
      - name: Safety suite (SYNTHETIC adversarial fixtures + approval boundary)
        run: make safety
      - name: Upload responses that did not match their pins (diagnosis only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-responses-py${{ matrix.python }}
          path: data/raw/_rejected/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-py${{ matrix.python }}
          path: |
            artifacts/eval/
            artifacts/g5_safety_summary.json
          if-no-files-found: warn
