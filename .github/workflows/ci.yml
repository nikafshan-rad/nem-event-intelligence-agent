name: ci

# Deterministic check against the reviewed, pinned source versions only. It never accepts upstream content that
# differs from data/source_selection.json; the separate publisher-refresh workflow (refresh.yml) detects and
# reports revisions for review (docs/source-governance.md).
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fresh:
        description: "Ignore the embedding-model cache"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # HEAD^ is the base branch (pull requests) or the previous commit (pushes)
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pin changes carry a reviewed history entry
        run: python scripts/check_pin_changes.py --base HEAD^
      # Publisher bytes come from the approved-bytes store (docs/pinned-store.md), never from a cache: GitHub deletes
      # caches unused for 7 days. Only the embedding model is cached (it is pinned by revision and re-downloadable).
      - name: Cache the embedding model
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.fresh) }}
        uses: actions/cache@v4
        with:
          path: data/models
          key: nem-models-${{ hashFiles('src/nem_agent/retrieval/embed.py') }}
      - name: Install (pinned)
        run: make setup SYSTEM_PY=python
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Approved-bytes index covers every pin (no network)
        run: make store-verify
      - name: Restore approved publisher bytes (only bytes matching the current pins; fails if any is missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: make restore-pinned
      - name: Build the data store from the restored pinned bytes
        run: make data
      - name: Build the document index
        run: make index
      - name: The pinned build contacted no publisher
        run: .venv/bin/python -m nem_agent.cli publisher-downloads --expect-none
      - name: Tests (unit, integration, real-data, synthetic safety fixtures)
        run: make test
      - name: Offline evaluation (replay; hosted-model evaluation is not run in CI)
        run: make eval
      - name: Safety suite (SYNTHETIC adversarial fixtures + approval boundary)
        run: make safety
      - name: Upload responses that did not match their pins (diagnosis only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-responses-py${{ matrix.python }}
          path: data/raw/_rejected/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-py${{ matrix.python }}
          path: |
            artifacts/eval/
            artifacts/g5_safety_summary.json
          if-no-files-found: warn
