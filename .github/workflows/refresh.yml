name: publisher-refresh

# Downloads what AEMO and NASA serve now, compares it with the reviewed pins and writes a report for a human
# reviewer. It never changes data/source_selection.json, never commits and never feeds the application: a new
# version is used only after `scripts/repin_source.py` and a reviewed pull request (docs/source-governance.md).
on:
  schedule:
    - cron: "17 19 * * 1"   # weekly, Monday 19:17 UTC (Tuesday morning in the NEM)
  workflow_dispatch:
  pull_request:
    paths:
      - "src/nem_agent/refresh.py"
      - "src/nem_agent/sources.py"
      - "src/nem_agent/rawstore.py"
      - "src/nem_agent/pinstore.py"
      - "data/pinned_store.json"
      - "scripts/repin_source.py"
      - "scripts/check_pin_changes.py"
      - "data/source_selection.json"
      - ".github/workflows/refresh.yml"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore the embedding-model cache if one exists (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data/models
          key: nem-models-${{ hashFiles('src/nem_agent/retrieval/embed.py') }}
      - name: Install (pinned)
        run: make setup SYSTEM_PY=python
      # The pinned bytes come from the approved-bytes store, so content diffs and the baseline evaluation always
      # have the approved versions to compare with (docs/pinned-store.md).
      - name: Restore approved publisher bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: make restore-pinned
      - name: Build from the pinned versions (baseline; a revised source is reported, not substituted)
        run: make data && make index || echo "::warning::pinned build incomplete; the refresh report explains why"
      - name: Publisher refresh check
        run: make refresh-check
      - name: Upload the refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-refresh-report
          path: |
            artifacts/source_refresh/*/report.md
            artifacts/source_refresh/*/report.json
          if-no-files-found: warn
          retention-days: 90
